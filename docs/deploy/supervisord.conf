; Run as the dedicated deployment user, not root. Paths are supplied by environment.
[unix_http_server]
file=%(ENV_NEXTLINE_STATE)s/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_NEXTLINE_STATE)s/supervisor.log
pidfile=%(ENV_NEXTLINE_STATE)s/supervisor.pid
childlogdir=%(ENV_NEXTLINE_STATE)s
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_NEXTLINE_STATE)s/supervisor.sock

[program:nextline]
command=%(ENV_NEXTLINE_NODE)s dist/server/main.mjs
directory=%(ENV_NEXTLINE_ROOT)s
environment=NEXTLINE_DATA_DIR="%(ENV_NEXTLINE_STATE)s/data",NEXTLINE_PUBLIC_URL="%(ENV_NEXTLINE_PUBLIC_URL)s",NEXTLINE_TRUSTED_PROXIES="127.0.0.1",NEXTLINE_HOST="127.0.0.1",NEXTLINE_PORT="3000"
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_NEXTLINE_STATE)s/nextline.log
stderr_logfile=%(ENV_NEXTLINE_STATE)s/nextline-error.log

[program:caddy]
command=%(ENV_NEXTLINE_CADDY)s run --config %(ENV_NEXTLINE_CADDYFILE)s --adapter caddyfile
environment=XDG_DATA_HOME="%(ENV_NEXTLINE_STATE)s/caddy-data",XDG_CONFIG_HOME="%(ENV_NEXTLINE_STATE)s/caddy-config"
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_NEXTLINE_STATE)s/caddy.log
stderr_logfile=%(ENV_NEXTLINE_STATE)s/caddy-error.log
